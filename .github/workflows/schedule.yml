name: "🔄 Schedule tokens Updates"

on:
  schedule:
    - cron: "25/10 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: read

    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug
        run: |
          echo "`Allo Guv`nor!"